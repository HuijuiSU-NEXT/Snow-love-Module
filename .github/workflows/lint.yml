name: ShellCheck

on:
  push:
    paths:
      - "*.sh"
  pull_request:
    paths:
      - "*.sh"

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: ludeeus/action-shellcheck@master
        with:
          severity: warning
